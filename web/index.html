<!doctype html>
<html lang="es" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouShop — Poleras oversize y jeans para todos los días</title>
    <meta name="description" content="Descubre la colección casual de YouShop: poleras oversize, jeans rectos y tiendas conectadas en Bolivia." />

    <!-- PWA (CU30): instalable y operable sin conexión con base local. -->
    <!-- use-credentials: los previews de Vercel tienen Deployment Protection;
         sin la cookie de Vercel el manifest redirige al SSO y el navegador
         lo bloquea por CORS. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <meta name="theme-color" content="#7a1c30" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="YouShop" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  </head>
  <body class="h-full bg-gray-50 text-gray-900 font-sans selection:bg-indigo-100 selection:text-indigo-900 antialiased overflow-hidden">

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
